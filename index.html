<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZ EXPERT - PAVILION PROJECT | Phase A Management</title>
<meta name="description" content="Upload Excel or PDF construction data and get instant dashboards: cost, progress, delays, contractors, and AI answers. Free and private.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><span class="logo-mark">▲</span> <span class="logo-text">AZ EXPERT<small>PAVILION PROJECT</small></span></div>
  <nav id="nav">
    <button class="nav-btn active" data-view="phasea" id="nav-phasea">🏘 Phase A Map</button>
    <button class="nav-btn" data-view="dashboard" id="nav-dashboard">📊 Dashboard</button>
    <button class="nav-btn" data-view="masterplan" id="nav-masterplan">🗺 Masterplan</button>
    <button class="nav-btn" data-view="sections" id="nav-sections">🗂 Sections</button>
    <button class="nav-btn" data-view="risks" id="nav-risks">⚠️ Risks &amp; Alerts</button>
    <button class="nav-btn" data-view="docs" id="nav-docs">📄 PDF Documents</button>
    <button class="nav-btn" data-view="ai" id="nav-ai">🤖 Ask AI</button>
    <button class="nav-btn needs-edit" data-view="approvals" id="nav-approvals">✅ Approvals <span id="ap-badge" class="badge" style="display:none"></span></button>
    <button class="nav-btn needs-admin" data-view="users" id="nav-users">👥 Users</button>
  </nav>
  <div class="side-foot">
    <div id="auth-chip" class="auth-chip"></div>
    <button class="btn ghost needs-edit" id="btn-demo">Load demo data</button>
    <button class="btn ghost danger needs-admin" id="btn-clear">Clear all data</button>
    <p class="muted small">🔒 Files are processed in your browser. Nothing is uploaded.</p>
    <p class="muted small" style="margin-top:12px;opacity:0.7">Developed by <b>Abdulazeez</b></p>
  </div>
</aside>

<main>
  <header class="topbar">
    <div>
      <h1 id="page-title">Project Dashboard</h1>
      <p class="muted" id="page-sub">Upload Excel or PDF files to begin</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="btn-export">⬇ Export report</button>
      <label class="btn primary needs-edit" for="file-input">＋ Upload files</label>
      <input type="file" id="file-input" multiple accept=".xlsx,.xls,.csv,.pdf" hidden>
    </div>
  </header>

  <div id="dropzone" class="dropzone needs-edit">
    <div class="dz-icon">⇪</div>
    <strong>Drop Excel / CSV / PDF files here</strong>
    <span class="muted">Re-uploading a file with the same name automatically updates its data</span>
  </div>

  <section id="view-phasea" class="view"></section>
  <section id="view-dashboard" class="view hidden"></section>
  <section id="view-masterplan" class="view hidden"></section>
  <section id="view-sections" class="view hidden"></section>
  <section id="view-risks" class="view hidden"></section>
  <section id="view-docs" class="view hidden"></section>
  <section id="view-ai" class="view hidden"></section>
  <section id="view-approvals" class="view hidden"></section>
  <section id="view-users" class="view hidden"></section>
</main>
<div id="toast" class="toast"></div>
<div id="auth-overlay" class="auth-overlay"></div>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="approvals.js"></script>
<script src="phasea.js"></script>
<script src="plan.js"></script>
<script src="app.js"></script>
<script src="ai.js"></script>
<script src="smart.js"></script>
</body>
</html>
